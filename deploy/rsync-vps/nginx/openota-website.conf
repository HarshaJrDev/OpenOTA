# Marketing site + docs — openota.xyz and docs.openota.xyz
#
# Both hostnames proxy to the SAME upstream (apps/docs, PM2 process "openota-docs" on
# 127.0.0.1:3003). apps/docs is one Next.js app that serves the marketing pages (/, /features,
# /pricing, /download, /contact) AND the documentation (/docs) — there is no separate "website app"
# to run as a second process.
#
# Install:
#   sudo cp openota-website.conf /etc/nginx/sites-available/
#   sudo ln -s /etc/nginx/sites-available/openota-website.conf /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx

limit_req_zone $binary_remote_addr zone=openota_website:10m rate=30r/s;

server {
    listen 80;
    listen [::]:80;
    server_name openota.xyz docs.openota.xyz;

    # certbot's webroot plugin needs this path answerable over plain HTTP for renewal.
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name openota.xyz docs.openota.xyz;

    # Adjust these two paths to wherever your existing Let's Encrypt cert for these two hostnames
    # actually lives (you said SSL is already installed) — typically:
    #   /etc/letsencrypt/live/openota.xyz/fullchain.pem
    # If openota.xyz and docs.openota.xyz were issued as SEPARATE certs rather than one cert
    # covering both hostnames, split this into two server blocks instead — nginx only supports one
    # `ssl_certificate` directive per server block.
    ssl_certificate     /etc/letsencrypt/live/openota.xyz/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/openota.xyz/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    gzip on;
    gzip_comp_level 5;
    gzip_min_length 256;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml font/woff2;

    limit_req zone=openota_website burst=60 nodelay;

    # Next.js's own build-hashed static assets — safe to cache aggressively, filename changes on
    # every build.
    location /_next/static/ {
        proxy_pass http://127.0.0.1:3003;
        proxy_set_header Host $host;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location / {
        proxy_pass http://127.0.0.1:3003;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_cache_bypass $http_upgrade;
    }
}
