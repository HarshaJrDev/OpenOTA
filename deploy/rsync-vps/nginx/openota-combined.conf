# OpenOTA — single nginx site file for openota.xyz + api./dashboard./docs. subdomains.
# Matches the site that was already enabled on this VPS as /etc/nginx/sites-available/openota
# (single SAN cert covering all four hostnames) — rewritten here with real proxy_pass directives
# for dashboard/docs (previously placeholder `return 200` blocks) and WebSocket/upload-size
# handling added to the API block. Kept as one file, not split into three, to match what's already
# enabled and avoid juggling a second sites-enabled symlink set.

limit_req_zone $binary_remote_addr zone=openota_api:10m rate=60r/s;

# Both HTTP and HTTPS www -> apex redirects live here, not just HTTP: the cert only gained
# www.openota.xyz in its SAN list after being --expand'd (it was issued for the bare four
# hostnames originally, so https://www.openota.xyz used to hard-fail TLS verification instead of
# redirecting at all). Redirecting www at 443 too, rather than letting the block below answer
# www.openota.xyz directly, avoids serving the identical site under two canonical URLs — Google
# treats openota.xyz and www.openota.xyz as different URLs unless told otherwise, which duplicates
# indexing/ranking signal instead of consolidating it onto the one canonical host.
server {
    listen 80;
    server_name openota.xyz www.openota.xyz;
    return 301 https://openota.xyz$request_uri;
}

server {
    listen 443 ssl http2;
    server_name www.openota.xyz;

    ssl_certificate /etc/letsencrypt/live/openota.xyz/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/openota.xyz/privkey.pem;

    return 301 https://openota.xyz$request_uri;
}

server {
    listen 443 ssl http2;
    server_name openota.xyz;

    ssl_certificate /etc/letsencrypt/live/openota.xyz/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/openota.xyz/privkey.pem;

    location / {
        proxy_pass http://127.0.0.1:3003;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

server {
    listen 80;
    server_name api.openota.xyz;
    return 301 https://api.openota.xyz$request_uri;
}

server {
    listen 443 ssl http2;
    server_name api.openota.xyz;

    ssl_certificate /etc/letsencrypt/live/openota.xyz/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/openota.xyz/privkey.pem;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    client_max_body_size 220M; # 200MB app limit (OPENOTA_MAX_PACKAGE_SIZE_MB) + multipart headroom
    limit_req zone=openota_api burst=120 nodelay;

    location / {
        proxy_pass http://127.0.0.1:3001;
        proxy_http_version 1.1;

        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
        proxy_cache_bypass $http_upgrade;
    }

    location = /health {
        proxy_pass http://127.0.0.1:3001;
        proxy_set_header Host $host;
        access_log off;
    }
}

server {
    listen 80;
    server_name docs.openota.xyz;
    return 301 https://docs.openota.xyz$request_uri;
}

server {
    listen 443 ssl http2;
    server_name docs.openota.xyz;

    ssl_certificate /etc/letsencrypt/live/openota.xyz/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/openota.xyz/privkey.pem;

    location / {
        proxy_pass http://127.0.0.1:3003;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

server {
    listen 80;
    server_name dashboard.openota.xyz;
    return 301 https://dashboard.openota.xyz$request_uri;
}

server {
    listen 443 ssl http2;
    server_name dashboard.openota.xyz;

    ssl_certificate /etc/letsencrypt/live/openota.xyz/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/openota.xyz/privkey.pem;

    location / {
        proxy_pass http://127.0.0.1:3002;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
