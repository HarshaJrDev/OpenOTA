# Backend API — api.openota.xyz
# PM2 process "openota-server" on 127.0.0.1:3001.
#
# Two things this API needs that the other two configs don't:
#   1. A real WebSocket upgrade path — apps/server attaches a WS server to the same HTTP server
#      (real-time release/rollback notifications to devices and the dashboard). Without the
#      Upgrade/Connection headers below, every WS connection attempt hangs or 400s.
#   2. A large client_max_body_size — OTA package uploads default to 200MB
#      (OPENOTA_MAX_PACKAGE_SIZE_MB); nginx's 1MB default would reject every real upload with a
#      413 before Express even saw the request.

limit_req_zone $binary_remote_addr zone=openota_api:10m rate=60r/s;

server {
    listen 80;
    listen [::]:80;
    server_name api.openota.xyz;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name api.openota.xyz;

    ssl_certificate     /etc/letsencrypt/live/api.openota.xyz/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api.openota.xyz/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    # helmet() (already applied inside apps/server) sets most security headers at the Express
    # layer — HSTS is worth setting here too since it must be present even on responses that never
    # reach Express (e.g. a 502 while the app is mid-reload).
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    client_max_body_size 220M; # 200MB app limit + headroom for multipart overhead

    limit_req zone=openota_api burst=120 nodelay;

    location / {
        proxy_pass http://127.0.0.1:3001;
        proxy_http_version 1.1;

        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Long-lived WS connections and slow uploads over mobile networks both need this raised
        # well past nginx's 60s default.
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;

        proxy_cache_bypass $http_upgrade;
    }

    # A cheap, unauthenticated liveness probe — used by deploy.sh's health check and safe to hit
    # from any external uptime monitor (UptimeRobot, etc.) without exposing anything sensitive.
    location = /health {
        proxy_pass http://127.0.0.1:3001;
        proxy_set_header Host $host;
        access_log off;
    }
}
