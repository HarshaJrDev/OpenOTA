# Render Blueprint for the OpenOTA server (apps/server).
#
# Deploy: push this repo, then in the Render dashboard "New +" -> "Blueprint" and pick this repo.
#
# IMPORTANT — persistence:
#   - Metadata (users/projects/api_keys) lives in Postgres, chosen via DATABASE_URL. Set it to your
#     Supabase project's connection string (Supabase dashboard -> Project Settings -> Database ->
#     Connection string -> URI) so accounts/projects survive restarts with NO persistent disk
#     needed for the database. Leave it unset and the server falls back to an embedded PGlite
#     database on the mounted disk below — fine for a demo, but ephemeral on Render's Free plan
#     (no disk) and ties the DB to this one service's disk on paid plans.
#   - OTA package bytes (with STORAGE_PROVIDER=local, the default below) still need a persistent
#     disk regardless of the database choice — hence `plan: starter` + the mounted disk. Set
#     STORAGE_PROVIDER=supabase instead to store package bytes in Supabase Storage and drop the
#     disk requirement entirely (see docs/STORAGE.md).
#
# If you want a Free-tier demo instead (local package storage resets on restart — fine only for a
# throwaway link): change `plan: starter` -> `plan: free`, delete the `disk:` block, and set
# STORAGE_PROVIDER=supabase (so package bytes at least persist off-box) or accept it resetting.

services:
  - type: web
    name: openota-server
    runtime: node
    plan: starter
    rootDir: .
    # NODE_ENV=production (set below) is also read by `pnpm install`, which then skips
    # devDependencies (e.g. @types/node) — tsc needs them to build. Force dev deps in for install,
    # then build; the resulting dist/ doesn't care what NODE_ENV was during compilation.
    buildCommand: pnpm install --frozen-lockfile --prod=false && pnpm turbo build --filter=@openota/server
    startCommand: pnpm --filter @openota/server start:prod
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      # Signs session cookies. Render generates a strong value once and keeps it stable across
      # deploys (rotating it would invalidate everyone's session).
      - key: SESSION_SECRET
        generateValue: true
      # Set this to your Supabase Postgres connection string so metadata survives restarts. Unset
      # falls back to embedded PGlite on the mounted disk (see the persistence note above).
      - key: DATABASE_URL
        sync: false
      - key: STORAGE_PROVIDER
        value: local
      - key: STORAGE_ROOT
        value: /data/storage
      # Must be the dashboard's exact origin (e.g. https://open-ota-dashboard.vercel.app) — the
      # cross-site session cookie only works when the API returns credentials for a real origin,
      # never "*". Set in the Render dashboard; not committed here.
      - key: CORS_ALLOWED_ORIGINS
        sync: false
      # Optional legacy single-tenant self-host key. Leave unset for the multi-tenant/dashboard flow.
      - key: OPENOTA_API_KEY
        sync: false
    disk:
      name: openota-data
      mountPath: /data
      sizeGB: 1
