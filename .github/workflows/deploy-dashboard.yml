name: Deploy Dashboard to Vercel

on:
  push:
    branches:
      - main
    paths:
      - "apps/dashboard/**"
      - "packages/shared/**"
      - "packages/ui/**"
      - "pnpm-lock.yaml"
      - ".github/workflows/deploy-dashboard.yml"
  workflow_dispatch:

jobs:
  deploy:
    name: Build and deploy
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Vercel CLI
        run: npm install --global vercel@latest

      # Run from the repo root, not apps/dashboard: the Vercel project has Root Directory set to
      # apps/dashboard on vercel.com, so invoking the CLI from inside that same subdirectory
      # doubles the path ("apps/dashboard/apps/dashboard" — this bit us once already). Running
      # from root with .vercel/project.json also at root lets Vercel apply its own Root Directory
      # setting exactly once, correctly.
      - name: Pull Vercel project settings
        run: vercel pull --yes --environment=production --token=${{ secrets.VERCEL_TOKEN }}
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID_DASHBOARD }}

      - name: Build
        run: vercel build --prod --token=${{ secrets.VERCEL_TOKEN }}

      - name: Deploy (prebuilt)
        run: vercel deploy --prebuilt --prod --token=${{ secrets.VERCEL_TOKEN }}
