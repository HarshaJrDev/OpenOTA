name: Deploy Dashboard to Vercel

on:
  push:
    branches:
      - main
    paths:
      - "apps/dashboard/**"
      - "packages/shared/**"
      - "packages/ui/**"
      - "pnpm-lock.yaml"
      - ".github/workflows/deploy-dashboard.yml"
  workflow_dispatch:

jobs:
  deploy:
    name: Build and deploy
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Vercel CLI
        run: npm install --global vercel@latest

      # `vercel pull` links this checkout to the Vercel project (VERCEL_ORG_ID/VERCEL_PROJECT_ID)
      # and downloads that project's env vars/settings — apps/dashboard/vercel.json then drives
      # the actual monorepo-aware install/build commands from there.
      - name: Pull Vercel project settings
        working-directory: apps/dashboard
        run: vercel pull --yes --environment=production --token=${{ secrets.VERCEL_TOKEN }}
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID_DASHBOARD }}

      - name: Build
        working-directory: apps/dashboard
        run: vercel build --prod --token=${{ secrets.VERCEL_TOKEN }}

      - name: Deploy (prebuilt)
        working-directory: apps/dashboard
        run: vercel deploy --prebuilt --prod --token=${{ secrets.VERCEL_TOKEN }}
