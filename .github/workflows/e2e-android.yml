name: OpenOTA Android Certification

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  server-pipeline:
    name: Server pipeline (CLI + Server)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build shared contracts + SDK
        run: |
          pnpm --filter @openota/shared build
          pnpm --filter @openota/sdk build

      - name: Generate fixtures (real CLI + real server round trip)
        run: pnpm --filter @openota/e2e fixtures:generate

      - name: Run server-side pipeline tests
        run: pnpm --filter @openota/e2e test:server

      - name: Upload fixtures for the Android job
        uses: actions/upload-artifact@v4
        with:
          name: e2e-fixtures
          path: apps/e2e/android/src/androidTest/assets/fixtures
          retention-days: 7

  android-instrumented:
    name: Android instrumented certification suite
    needs: server-pipeline
    runs-on: macos-14 # only macOS/Linux-with-KVM runners can run the emulator with acceptable speed
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Download fixtures generated by the server-pipeline job
        uses: actions/download-artifact@v4
        with:
          name: e2e-fixtures
          path: apps/e2e/android/src/androidTest/assets/fixtures

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Run instrumented certification suite on an emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 33
          arch: x86_64
          working-directory: apps/example/android
          script: ./gradlew :e2e:connectedDebugAndroidTest

      - name: Upload instrumented test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-e2e-report
          path: apps/e2e/android/build/reports/androidTests
          retention-days: 14
