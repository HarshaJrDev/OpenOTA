buildscript {
    ext.kotlin_version = rootProject.ext.has("kotlinVersion") ? rootProject.ext.kotlinVersion : "1.9.24"

    repositories {
        google()
        mavenCentral()
    }

    dependencies {
        classpath "org.jetbrains.kotlin:kotlin-gradle-plugin:$kotlin_version"
    }
}

apply plugin: "com.android.library"
apply plugin: "kotlin-android"

// The New Architecture's bridgeless dispatch (global.__turboModuleProxy) requires a real
// generated NativeOpenOTASpecJSI matching this module's name — `codegenConfig.jsSrcsDir` in
// package.json points at `src/`, which holds the actual codegen-parseable Spec
// (NativeOpenOTA.ts). An earlier version of this comment claimed jsSrcsDir could stay empty for
// a hand-authored TurboModule and codegen would still emit a valid CMakeLists.txt; that was
// wrong — an empty jsSrcsDir produces a stub ModuleProvider that unconditionally returns
// nullptr, so every JS call fails with "Native module 'OpenOTA' is not linked", 100%
// reproducibly, regardless of how correctly OpenOTAModule.kt/OpenOTAPackage.kt are implemented.
apply plugin: "com.facebook.react"

def getExtOrDefault(name, defaultValue) {
    return rootProject.ext.has(name) ? rootProject.ext.get(name) : defaultValue
}

android {
    namespace "com.openota.runtime"
    compileSdkVersion getExtOrDefault("compileSdkVersion", 35)

    defaultConfig {
        minSdkVersion getExtOrDefault("minSdkVersion", 24)
        targetSdkVersion getExtOrDefault("targetSdkVersion", 35)
        // Without this, `androidTest` sources using `@RunWith(AndroidJUnit4::class)` (all of
        // them) are silently invisible to `connectedAndroidTest` — it falls back to the legacy
        // JUnit3-style runner, which finds zero tests. apps/e2e's own build.gradle already sets
        // this; native-android's never did, so its androidTest suite could only ever be exercised
        // indirectly through apps/e2e's harness.
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = "17"
    }

    lintOptions {
        abortOnError false
    }

    testOptions {
        unitTests {
            // BundleVerifierTest exercises OpenOTALogger, which calls android.util.Log; the
            // Android Gradle plugin's unit-test stub jar throws on any Log.* call unless this is
            // set. Nothing under test relies on real Log output.
            returnDefaultValues = true
        }
    }
}

repositories {
    google()
    mavenCentral()
}

dependencies {
    implementation "com.facebook.react:react-android"
    implementation "org.jetbrains.kotlin:kotlin-stdlib:$kotlin_version"
    implementation "androidx.annotation:annotation:1.9.1"
    // Push notifications for killed-app OTA delivery (see OpenOTAFirebaseMessagingService) — a
    // library module never applies the Google Services *plugin* itself (that's app-level only,
    // via the consuming app's own google-services.json), it just consumes the BoM like any other
    // dependency. No-op at runtime for an app that never adds google-services.json: Firebase's own
    // SDK degrades to "not configured" rather than crashing.
    implementation platform("com.google.firebase:firebase-bom:33.5.1")
    implementation "com.google.firebase:firebase-messaging"

    testImplementation "junit:junit:4.13.2"
    testImplementation "org.jetbrains.kotlin:kotlin-test:$kotlin_version"
    // Real org.json implementation for local (non-instrumented) unit tests: Android's own
    // org.json classes are stubs on the plain JVM and throw at runtime unless mocked/Robolectric
    // is used. This jar shadows those stubs on the unit test classpath so Manifest.kt's parsing
    // logic can be exercised without spinning up an emulator.
    testImplementation "org.json:json:20231013"
    // Used only to stub android.content.Context (filesDir) so BundleStorage can be exercised
    // against real temp-directory files in plain JVM unit tests, without Robolectric.
    testImplementation "org.mockito:mockito-core:5.11.0"

    androidTestImplementation "androidx.test.ext:junit:1.2.1"
    androidTestImplementation "androidx.test:runner:1.6.2"
}
