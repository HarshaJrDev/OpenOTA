services:
  server:
    build:
      context: .
      dockerfile: apps/server/Dockerfile
    container_name: openota-server
    restart: unless-stopped
    ports:
      - "${PORT:-3900}:${PORT:-3900}"
    env_file:
      # Real bug found via a true fresh-clone `docker compose up -d` test: Compose refuses to
      # start at all if `.env` doesn't literally exist on disk — "works with no .env file" (the
      # comment below) was only true for a developer who'd already created one from
      # .env.example, not a genuinely fresh clone. `required: false` (Compose v2.24+) makes a
      # missing .env a no-op instead of a hard failure.
      - path: .env
        required: false
    environment:
      # Overridable via .env — these are just safe defaults so `docker compose up` works with no
      # .env file at all (self-hosting on local storage, zero external accounts required).
      PORT: ${PORT:-3900}
      NODE_ENV: ${NODE_ENV:-production}
      STORAGE_PROVIDER: ${STORAGE_PROVIDER:-local}
      STORAGE_ROOT: /data/storage
      OPENOTA_MAX_PACKAGE_SIZE_MB: ${OPENOTA_MAX_PACKAGE_SIZE_MB:-200}
    volumes:
      # Named volumes, not bind mounts, so data survives `docker compose down` / container
      # recreation.
      #   openota_storage: release bundles. Only relevant when STORAGE_PROVIDER=local —
      #     irrelevant (but harmless) in Supabase mode, where nothing is ever written here.
      #   openota_pgdata: the embedded PGlite database (Cloud-mode metadata — users, projects,
      #     API keys, releases). Only relevant when DATABASE_URL is unset (the default); irrelevant
      #     (but harmless) if you point DATABASE_URL at a real Postgres/Supabase instead. Without
      #     this volume the path `db/client.ts` writes PGlite to (apps/server/data/pgdata, relative
      #     to the container's WORKDIR) lives in the container's writable layer and is silently
      #     wiped on every recreation — this volume is what makes that data durable.
      - openota_storage:/data/storage
      - openota_pgdata:/repo/apps/server/data/pgdata

volumes:
  openota_storage:
  openota_pgdata:
