version: "3.9"

services:
  postgres:
    image: postgres:17
    container_name: openota-postgres
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: openota
      POSTGRES_PASSWORD: openota
      POSTGRES_DB: openota
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data: